[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "derbysoft-logs"
version = "0.4.4"
description = "DerbySoft business log investigation tools for Codex"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "opensearch-mcp-server-py==0.12.0",
]

[project.scripts]
derbysoft-logs = "derbysoft_logs.cli:main"
derbysoft-streamlog = "derbysoft_logs.server:main"
derbysoft-loki = "derbysoft_logs.loki_server:main"
derbysoft-log-settings = "derbysoft_logs.settings_server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/derbysoft_logs"]
