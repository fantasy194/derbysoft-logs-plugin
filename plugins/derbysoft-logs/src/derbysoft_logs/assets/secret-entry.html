<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DerbySoft Logs · 连接凭证</title>
<style>
:root{color-scheme:light dark;font:15px/1.55 system-ui,sans-serif;color:#202c3c;background:#f5f7fa}*{box-sizing:border-box}main{max-width:720px;margin:56px auto;padding:0 24px}h1{font-size:28px;margin:6px 0}p{color:#617086}.brand{color:#2461b6;font-size:13px;font-weight:700;letter-spacing:.08em}section{margin:20px 0;border:1px solid #dce2eb;border-radius:14px;padding:24px;background:#fff}h2{font-size:18px;margin:0 0 10px}.endpoint{overflow-wrap:anywhere;font-family:ui-monospace,monospace;font-size:13px;color:#617086}label{display:block;margin-top:16px}input{width:100%;border:1px solid #b8c4d5;border-radius:8px;padding:11px;margin:6px 0 16px;font:inherit}button{background:#205ec0;color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{margin-top:10px;white-space:pre-wrap}.bad{color:#b52c32}.good{color:#16814e}@media(prefers-color-scheme:dark){:root{background:#111822;color:#e5edf9}section{background:#1a2432;border-color:#344358}p,.endpoint{color:#a2b1c5}input{background:#111822;color:#e5edf9;border-color:#50617a}.good{color:#7dd3ab}.bad{color:#ff9ca4}}@media(max-width:500px){main{margin:24px auto;padding:0 16px}section{padding:18px}}
</style>
<main><div class="brand">DERBYSOFT LOGS</div><h1>连接凭证</h1><p id="intro">正在读取环境…</p><div id="content"></div><p>此页面十分钟后失效。保存完成后可关闭页面，返回插件设置测试连接。</p><div id="status" class="status" role="status"></div></main>
<script>
'use strict';
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const content=document.getElementById('content'),status=document.getElementById('status');
async function request(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{'X-Setup-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败');return data;}
function element(tag,text,cls){const node=document.createElement(tag);if(text)node.textContent=text;if(cls)node.className=cls;return node;}
async function init(){try{if(!token)throw new Error('请从 DerbySoft Logs 插件设置中的“配置凭证”按钮打开此页面。');const {environment:env}=await request('/state');document.getElementById('intro').textContent=`环境：${env.label||env.id} (${env.id})。凭证仅保存到本机系统凭证库。`;
for(const [name,conf] of Object.entries(env.services)){if(!conf.url)continue;const section=element('section');section.append(element('h2',({opensearch:'OpenSearch',streamlog:'StreamLog',loki:'Loki'})[name]||name),element('div',conf.url,'endpoint'));if(conf.username)section.append(element('p','账号：'+conf.username));if(name==='loki'&&conf.auth_type==='none'){section.append(element('p','当前连接未启用认证。'));content.append(section);continue;}const label=element('label',name==='streamlog'?'Authorization':name==='loki'&&conf.auth_type==='bearer'?'Bearer token':'密码'),input=document.createElement('input');input.type='password';input.autocomplete='new-password';input.maxLength=4096;input.id='secret-'+name;label.htmlFor=input.id;const btn=element('button',conf.has_secret?'更新凭证':'保存凭证'),result=element('div','','status');result.setAttribute('role','status');section.append(label,input,btn,result);btn.addEventListener('click',async()=>{if(!input.value){result.textContent='请输入凭证。';result.className='status bad';return;}btn.disabled=true;try{await request('/credentials',{service:name,secret:input.value});input.value='';result.textContent='已保存。可返回插件设置测试连接。';result.className='status good';btn.textContent='更新凭证';}catch(error){result.textContent=error.message;result.className='status bad';}finally{btn.disabled=false;}});content.append(section);}
if(!content.children.length)content.append(element('p','尚未设置服务地址。请先在插件设置填写地址，再重新打开此页面。'));
}catch(error){status.textContent=error.message;status.className='status bad';document.getElementById('intro').textContent='无法读取连接配置。';}}
init();
</script></html>
