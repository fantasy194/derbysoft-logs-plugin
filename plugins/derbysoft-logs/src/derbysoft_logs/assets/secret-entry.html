<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>连接凭证</title>
<style>
:root{color-scheme:light dark;--bg:#f6f8fb;--surface:#fff;--text:#1d2838;--sub:#66758a;--border:#dde4ed;--accent:#285acb;--accent-soft:#eaf1ff;--danger:#b42318;--wash:radial-gradient(ellipse at 92% -8%,#d5e7fb 0%,transparent 40%),linear-gradient(155deg,#f7fafc,#f4f7fb)}
@media(prefers-color-scheme:dark){:root{--bg:#111a27;--surface:#192435;--text:#eaf0f8;--sub:#a5b2c3;--border:#344359;--accent:#a1bdff;--accent-soft:#233956;--danger:#ffaaa3;--wash:radial-gradient(ellipse at 92% -8%,#244366 0%,transparent 42%),linear-gradient(155deg,#121e2c,#111a27)}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--wash);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:600px;margin:auto;padding:26px 24px 40px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:21px;line-height:1.25;margin:0}h2{font-size:15px;margin:0}.environment{font-size:13px;color:var(--sub);max-width:60%;text-align:right;overflow-wrap:anywhere}.card{margin:10px 0;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{font-size:12px;color:var(--sub);white-space:nowrap}.endpoint{font-size:12px;color:var(--sub);overflow-wrap:anywhere;margin-top:3px}.account{font-size:12px;color:var(--sub);overflow-wrap:anywhere;margin-top:1px}label{display:block;font-size:13px;font-weight:600;margin-top:15px}input{width:100%;height:38px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-top:5px;font:inherit;background:var(--surface);color:var(--text)}input:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 28%,transparent);outline-offset:1px}button{min-height:34px;border:1px solid #315eea;border-radius:8px;padding:6px 12px;margin-top:12px;font:inherit;font-weight:600;cursor:pointer;background:#315eea;color:#fff}button:hover:not(:disabled){background:#2548bb}button:disabled{opacity:.55;cursor:wait}.status{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}.status:empty{display:none}.bad{color:var(--danger)}.note{color:var(--sub);font-size:12px;margin-top:16px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:620px){main{padding:18px 16px 32px}}
</style>
</head>
<body><main>
<div class="heading"><h1>连接凭证</h1><div id="environment" class="environment">正在读取…</div></div>
<div id="content"></div>
<div id="status" class="status bad" role="status"></div>
<div class="note">凭证保存在本机系统凭证库</div>
</main>
<script>
'use strict';
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const content=document.getElementById('content'),status=document.getElementById('status');
async function request(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{'X-Setup-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败');return data;}
function element(tag,text,cls){const node=document.createElement(tag);if(text)node.textContent=text;if(cls)node.className=cls;return node;}
async function init(){try{
  if(!token)throw new Error('请从插件设置中的“配置凭证”打开此页面。');
  const {environment:env}=await request('/state');
  document.getElementById('environment').textContent=env.id;
  for(const [name,conf] of Object.entries(env.services)){
    if(!conf.url)continue;
    const section=element('section','','card'),header=element('div','','card-head');
    const badge=element('span',name==='loki'&&conf.auth_type==='none'?'无需认证':conf.has_secret?'已保存':'未配置','badge');
    header.append(element('h2',({opensearch:'OpenSearch',streamlog:'StreamLog',loki:'Loki'})[name]||name),badge);
    section.append(header,element('div',conf.url,'endpoint'));
    if(conf.username)section.append(element('div',conf.username,'account'));
    if(name==='loki'&&conf.auth_type==='none'){content.append(section);continue;}
    const label=element('label',name==='streamlog'?'Authorization':name==='loki'&&conf.auth_type==='bearer'?'Bearer token':'密码');
    const input=document.createElement('input');input.type='password';input.autocomplete='new-password';input.maxLength=4096;input.id='secret-'+name;label.htmlFor=input.id;
    const btn=element('button',conf.has_secret?'更新凭证':'保存凭证'),result=element('div','','status');result.setAttribute('role','status');
    section.append(label,input,btn,result);
    btn.addEventListener('click',async()=>{
      if(!input.value){result.textContent='请输入凭证。';result.className='status bad';input.focus();return;}
      btn.disabled=true;
      try{await request('/credentials',{service:name,secret:input.value});input.value='';badge.textContent='已保存';result.textContent='凭证已保存';result.className='sr-only';btn.textContent='更新凭证';}
      catch(error){result.textContent=error.message;result.className='status bad';}
      finally{btn.disabled=false;}
    });
    content.append(section);
  }
  if(!content.children.length)content.append(element('p','请先在日志设置中填写服务地址。'));
}catch(error){status.textContent=error.message;document.getElementById('environment').textContent='';}}
init();
</script></body></html>
