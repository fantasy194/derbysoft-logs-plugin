    @media(max-width:440px){main{padding:14px}.chart,.events,.sources{padding:12px}.bar-row{grid-template-columns:minmax(54px,90px) 1fr minmax(36px,auto);gap:6px}.metric-value{font-size:20px}}
  </style>
</head>
<body><main id="app" aria-live="polite"><div class="status" id="status">正在准备分析视图…</div></main>
<script>
(() => {
  'use strict';

  const root = document.getElementById('app'),
    host = window.parent,
    NS = 'http://www.w3.org/2000/svg';
  const colors = ['var(--accent)', 'var(--accent2)', '#d39330', '#b980dd', '#e07880', '#66a0ad'];
  let origin = null,
    initialized = false,
    early = null,
    resizePending = false;
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  function svg(tag, attrs = {}) {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
    return node;
  }
  function send(method, params) {
    const msg = {
      jsonrpc: '2.0',
      method
    };
    if (params !== undefined) msg.params = params;
    host.postMessage(msg, origin && origin !== 'null' ? origin : '*');
  }
  function theme(ctx) {
    if (!ctx || typeof ctx !== 'object') return;
    if (ctx.theme === 'light' || ctx.theme === 'dark') document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars && typeof vars === 'object') for (const [key, value] of Object.entries(vars)) if (/^--(?:color|font|border)-[a-z0-9-]+$/.test(key) && typeof value === 'string' && value.length < 500) document.documentElement.style.setProperty(key, value);
  }
  function status(text, error = false) {
    root.replaceChildren(el('div', 'status' + (error ? ' error' : ''), text));
  }
  function stamp(v) {
    return typeof v === 'string' ? v : '';
  }
  // Keep nanoseconds and timezone intact. Convert to integer ns only for chart position.
  function ns(s) {
    const m = /^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?:\.(\d{1,9}))?(Z|[+-]\d\d:\d\d)$/.exec(s || '');
    if (!m) return null;
    const ms = Date.parse(m[1] + m[3]);
    return Number.isFinite(ms) ? BigInt(ms) * 1000000n + BigInt((m[2] || '').padEnd(9, '0')) : null;
  }
  function shortStamp(value, showFraction = false) {
    const parts = /^(\d{4}-\d\d-\d\d)T(\d\d:\d\d):(\d\d)(\.\d{1,9})?(Z|[+-]\d\d:\d\d)$/.exec(value);
    if (!parts) return value;
    const seconds = parts[3] === '00' && !showFraction ? '' : ':' + parts[3];
    return parts[1] + ' ' + parts[2] + seconds + (showFraction && parts[4] ? parts[4] : '') + parts[5];
  }
  function valid(payload) {
    if (!payload || payload.schema_version !== 1 || !payload.report || typeof payload.report !== 'object') return false;
    const r = payload.report;
    if (typeof r.title !== 'string' || !r.title || typeof r.summary !== 'string' || !Array.isArray(r.sources) || !r.sources.length) return false;
    if (!['metrics', 'charts', 'events', 'notes'].every(k => Array.isArray(r[k])) || r.sources.length>16 || r.metrics.length>12 || r.charts.length>6 || r.events.length>150 || r.notes.length>8) return false;
    const ids = new Set();
    for (const s of r.sources) {
      if (!s || typeof s.id !== 'string' || ids.has(s.id) || typeof s.tool !== 'string' || typeof s.environment !== 'string' || typeof s.scope !== 'string' || !['complete', 'partial', 'sample', 'unknown'].includes(s.coverage)) return false;
      ids.add(s.id);
    }
    const refs = x => Array.isArray(x) && x.length > 0 && x.length <= 16 && new Set(x).size === x.length && x.every(id => ids.has(id));
    if (!r.metrics.every(m => m && typeof m.label === 'string' && typeof m.value === 'number' && Number.isFinite(m.value) && typeof m.unit === 'string' && refs(m.source_ids))) return false;
    const number = x => typeof x === 'number' && Number.isFinite(x) && Math.abs(x)<=Number.MAX_SAFE_INTEGER;
    const str = x => typeof x === 'string' && x.trim().length > 0 && x.length<=200;
    const nonnegative = x => number(x) && x >= 0;
    const unique = items => new Set(items).size === items.length;
    let observations=0;
    if (!unique(r.charts.map(c=>c?.id))) return false;
    for (const c of r.charts) {
      if (!c || !str(c.id) || !str(c.title) || typeof c.unit !== 'string' || !refs(c.source_ids)) return false;
      if (['bar', 'line', 'area', 'stacked_bar'].includes(c.kind)) {
        if (!str(c.x_label) || !Array.isArray(c.series) || !c.series.length || c.series.length>8 || !unique(c.series.map(s=>s?.name)) || !c.series.every(s =>
          s && str(s.name) && Array.isArray(s.points) && s.points.length<=400 && s.points.every(p =>
            p && str(p.x) && (p.y === null || number(p.y)) && (!['line','area'].includes(c.kind) || ns(p.x) !== null)))) return false;
        for(const s of c.series) {
          observations+=s.points.length;
          if (!unique(s.points.map(p=>['line','area'].includes(c.kind)?String(ns(p.x)):p.x))) return false;
        }
        if (c.kind !== 'stacked_bar' && c.mode !== undefined && c.mode !== null) return false;
        if (c.kind === 'stacked_bar' && (!['absolute', 'percent'].includes(c.mode || 'absolute') ||
          !c.series[0].points.length ||
          c.series.some(s => s.points.some(p => !nonnegative(p.y))) ||
          c.series.some(s => s.points.length !== c.series[0].points.length || s.points.some((p,i) => p.x !== c.series[0].points[i].x)) ||
          c.series[0].points.some((_,i)=>{const total=c.series.reduce((sum,s)=>sum+s.points[i].y,0);return !number(total) || c.mode==='percent' && total<=0;}))) return false;
      } else if (['pie','donut'].includes(c.kind)) {
        if (!Array.isArray(c.slices) || !c.slices.length || c.slices.length>40 || !c.slices.every(p => p && str(p.label) && nonnegative(p.value)) || !unique(c.slices.map(p=>p.label))) return false;
        const total=c.slices.reduce((sum,p)=>sum+p.value,0);
        if (!number(total) || total<=0) return false;
        observations+=c.slices.length;
      } else if (c.kind === 'histogram') {
        if (!str(c.x_label) || !Array.isArray(c.bins) || !c.bins.length || c.bins.length>120 || !c.bins.every((p,i) => p && number(p.lower) && number(p.upper) && p.lower < p.upper && Number.isSafeInteger(p.count) && p.count>=0 && Number.isFinite(p.count/(p.upper-p.lower)) && (!i || c.bins[i-1].upper<=p.lower)) || !number(c.bins.reduce((sum,p)=>sum+p.count,0))) return false;
        observations+=c.bins.length;
      } else if (c.kind === 'heatmap') {
        if (!str(c.x_label) || !str(c.y_label) || !Array.isArray(c.cells) || !c.cells.length || c.cells.length>400 || !c.cells.every(p => p && str(p.x) && str(p.y) && (p.value === null || number(p.value))) || !unique(c.cells.map(p=>JSON.stringify([p.x,p.y]))) || new Set(c.cells.map(p=>p.x)).size > 40 || new Set(c.cells.map(p=>p.y)).size > 40) return false;
        observations+=c.cells.length;
      } else if (c.kind === 'scatter') {
        if (!str(c.x_label) || !str(c.y_label) || !Array.isArray(c.points) || !c.points.length || c.points.length>400 || !c.points.every(p => p && number(p.x) && number(p.y) && (p.label === undefined || typeof p.label === 'string' && p.label.length<=200))) return false;
        observations+=c.points.length;
      } else if (c.kind === 'funnel') {
        if (!Array.isArray(c.stages) || !c.stages.length || c.stages.length>40 || !c.stages.every(p => p && str(p.label) && nonnegative(p.value)) || !unique(c.stages.map(p=>p.label))) return false;
        observations+=c.stages.length;
      } else if (c.kind === 'boxplot') {
        if (!Array.isArray(c.boxes) || !c.boxes.length || c.boxes.length>40 || !c.boxes.every(p => p && str(p.label) && ['min','q1','median','q3','max'].every(k => number(p[k])) && p.min <= p.q1 && p.q1 <= p.median && p.median <= p.q3 && p.q3 <= p.max) || !unique(c.boxes.map(p=>p.label))) return false;
        observations+=c.boxes.length;
      } else if (c.kind === 'sankey') {
        if (!Array.isArray(c.nodes) || c.nodes.length<2 || c.nodes.length>40 || !Array.isArray(c.links) || !c.links.length || c.links.length>120 || !c.nodes.every(p => p && str(p.id) && str(p.label)) || !unique(c.nodes.map(n=>n.id)) || !c.links.every(p => p && str(p.source) && str(p.target) && number(p.value) && p.value > 0 && c.nodes.some(n => n.id === p.source) && c.nodes.some(n => n.id === p.target)) || !unique(c.links.map(p=>JSON.stringify([p.source,p.target]))) || !number(c.links.reduce((sum,p)=>sum+p.value,0))) return false;
        const indegree=new Map(c.nodes.map(n=>[n.id,0]));
        for(const link of c.links) indegree.set(link.target,indegree.get(link.target)+1);
        const queue=[...indegree.keys()].filter(id=>indegree.get(id)===0);
        let visited=0;
        while(queue.length){const id=queue.pop();visited++;for(const link of c.links.filter(l=>l.source===id)){indegree.set(link.target,indegree.get(link.target)-1);if(indegree.get(link.target)===0)queue.push(link.target);}}
        if(visited!==c.nodes.length) return false;
        observations+=c.nodes.length+c.links.length;
      } else return false;
    }
    if (observations>1200) return false;
    return r.events.every(e => e && ns(e.timestamp) !== null && typeof e.label === 'string' && typeof e.service === 'string' && typeof e.process === 'string' && typeof e.detail === 'string' && ['info', 'success', 'warning', 'error', 'unknown'].includes(e.status) && refs(e.source_ids)) && r.notes.every(x => typeof x === 'string');
  }
  function receive(params) {
    if (!params || typeof params !== 'object') {
      status('无法读取分析结果。', true);
      return;
    }
    if (params.isError) {
      status('分析视图未能生成，请查看工具返回的信息。', true);
      return;
    }
    if (!valid(params.structuredContent)) {
      status('分析结果格式不完整，无法显示图表。', true);
      return;
    }
    render(params.structuredContent.report);
  }
  function sourceLabel(s) {
    return [s.environment, s.scope].filter(Boolean).join(' · ');
  }
  function fmt(v) {
    return v === null ? '缺失' : String(v);
  }
  function sourceRef(ids) {
    const button = el('button', 'source-ref', '来源：' + ids.join('、'));
    button.type = 'button';
    button.addEventListener('click', () => {
      const sources = root.querySelector('.sources');
      if (sources) {
        sources.open = true;
        const target = [...sources.querySelectorAll('.source')].find(node => ids.includes(node.dataset.sourceId));
        (target || sources).scrollIntoView({
          block: 'nearest'
        });
      }
    });
    return button;
  }
  function render(report) {
    root.replaceChildren();
    root.append(el('div', 'eyebrow', 'LOG ANALYSIS'), el('h1', '', report.title));
    if (report.summary) root.append(el('p', 'summary', report.summary));
    const tags = el('div', 'tags');
    for (const label of [...new Set(report.sources.map(sourceLabel))]) tags.append(el('span', 'tag', label));
    root.append(tags);
    const warning = report.sources.filter(s => s.coverage !== 'complete');
    if (warning.length) {
      const kinds = {
        partial: '不完整',
        sample: '样本',
        unknown: '覆盖范围未知'
      };
      root.append(el('div', 'coverage', '数据范围：' + warning.map(s => `${s.id} ${kinds[s.coverage]}`).join('；') + '。请结合来源查看。'));
    }
    if (report.metrics.length) {
      const grid = el('section', 'metrics');
      grid.setAttribute('aria-label', '关键指标');
      for (const m of report.metrics) {
        const card = el('div', 'metric'),
          value = el('div', 'metric-value', fmt(m.value));
        if (m.unit) value.append(el('span', 'unit', m.unit));
        card.append(el('div', 'metric-label', m.label), value, sourceRef(m.source_ids));
        grid.append(card);
      }
      root.append(grid);
    }
    const stack = el('div', 'stack');
    for (const chart of report.charts) stack.append(chartNode(chart));
    if (report.events.length) stack.append(eventsNode(report.events));
    if (!report.metrics.length && !report.charts.length && !report.events.length) stack.append(el('div', 'empty', '没有可展示的数据。'));
    stack.append(sourcesNode(report.sources));
    root.append(stack);
    if (report.notes.length) {
      const notes = el('ul', 'notes');
      for (const n of report.notes) notes.append(el('li', '', n));
      root.append(notes);
    }
  }
  function chartNode(chart) {
    const box = el('section', 'chart'),
      heading = el('div', 'row'),
      title = el('h2', '', chart.title),
      actions = el('div', 'actions'),
      plot = el('button', 'selected', '图表'),
      table = el('button', '', '数据');
    box.dataset.chartKind = chart.kind;
    plot.type = table.type = 'button';
    plot.setAttribute('aria-pressed', 'true');
    table.setAttribute('aria-pressed', 'false');
    plot.setAttribute('aria-label', chart.title + ' 图表');
    table.setAttribute('aria-label', chart.title + ' 数据');
    actions.append(plot, table);
    if (chart.unit) title.append(el('span', 'unit', chart.unit));
    heading.append(title, actions);
    box.append(heading, sourceRef(chart.source_ids));
    const legend = el('div', 'legend'),
      area = el('div', 'chart-area'),
      detail = el('div', 'point-detail', '选择数据点查看精确值'),
      series = chart.series || [],
      enabled = new Set(series.map((_, i) => i));
    detail.setAttribute('aria-live', 'polite');
    function draw() {
      area.replaceChildren();
      if (chart.kind === 'bar') drawBars(area, chart, enabled, detail);
      else if (chart.kind === 'line' || chart.kind === 'area') drawLine(area, chart, enabled, detail);
      else if (chart.kind === 'stacked_bar') drawStacked(area, chart, detail);
      else if (chart.kind === 'pie' || chart.kind === 'donut') drawPie(area, chart, detail);
      else if (chart.kind === 'histogram') drawHistogram(area, chart, detail);
      else if (chart.kind === 'heatmap') drawHeatmap(area, chart, detail);
      else if (chart.kind === 'scatter') drawScatter(area, chart, detail);
      else if (chart.kind === 'funnel') drawFunnel(area, chart, detail);
      else if (chart.kind === 'boxplot') drawBoxplot(area, chart, detail);
      else if (chart.kind === 'sankey') drawSankey(area, chart, detail);
    }
    series.forEach((s, i) => {
      const b = el('button', 'series-button', s.name),
        dot = el('span', 'dot');
      dot.style.setProperty('--dot', colors[i % colors.length]);
      b.prepend(dot);
      b.type = 'button';
      b.setAttribute('aria-pressed', 'true');
      if (chart.kind === 'stacked_bar') {
        const label = el('span', 'series-button', s.name);
        label.prepend(dot);
        legend.append(label);
      } else {
        b.addEventListener('click', () => {
          if (enabled.has(i)) enabled.delete(i);else enabled.add(i);
          b.setAttribute('aria-pressed', String(enabled.has(i)));
          draw();
        });

    area.append(graph,key,el('div','chart-note','各阶段展示给定值；不自动推断转化率或同一批次。'));
  }
  function drawBoxplot(area, chart, detail) {
    const boxes=chart.boxes,w=600,left=140,right=28,rowHeight=46,h=boxes.length*rowHeight+52;
    const min=Math.min(...boxes.map(p=>p.min)),max=Math.max(...boxes.map(p=>p.max));
    const x=v=>max===min?(left+w-right)/2:left+(v-min)/(max-min)*(w-left-right),graph=graphFor(chart,w,h);
    boxes.forEach((p,i)=>{
      const y=25+i*rowHeight, group=svg('g');
      group.append(svg('line',{x1:x(p.min),y1:y,x2:x(p.max),y2:y,stroke:'var(--sub)','stroke-width':2}));
      for(const v of [p.min,p.max]) group.append(svg('line',{x1:x(v),y1:y-8,x2:x(v),y2:y+8,stroke:'var(--sub)','stroke-width':2}));
      group.append(svg('rect',{x:x(p.q1),y:y-10,width:Math.max(1,x(p.q3)-x(p.q1)),height:20,fill:colors[0],'fill-opacity':'.55',stroke:colors[0]}));
      group.append(svg('line',{x1:x(p.median),y1:y-10,x2:x(p.median),y2:y+10,stroke:'var(--ink)','stroke-width':2}));
      graph.append(mark(group,'boxplot',`${p.label}: 最小值 ${p.min}, Q1 ${p.q1}, 中位数 ${p.median}, Q3 ${p.q3}, 最大值 ${p.max} ${chart.unit}`,detail));
      svgText(graph,left-8,y+4,String(i+1),'end');
    });
    svgText(graph,left,h-12,String(min));svgText(graph,w-right,h-12,String(max),'end');
    const wrap=el('div','svg-scroll');wrap.append(graph);area.append(wrap);
    const key=el('div','chart-key');
    boxes.forEach((p,i)=>key.append(el('span','',`${i+1}. ${p.label}`)));
    area.append(key,el('div','chart-note',`刻度范围：${min} – ${max} ${chart.unit}`));
  }
  function drawSankey(area, chart, detail) {
    const nodes=chart.nodes.map((n,i)=>({...n,index:i,level:0,incoming:0,outgoing:0,inScale:0,outScale:0})), byId=new Map(nodes.map(n=>[n.id,n]));
    const maxFlow=Math.max(...chart.links.map(link=>link.value));
    for(const link of chart.links){
      const a=byId.get(link.source),b=byId.get(link.target),normalized=link.value/maxFlow;
      a.outgoing+=link.value;b.incoming+=link.value;a.outScale+=normalized;b.inScale+=normalized;
    }
    // Longest-path layers, preserving explicit edges. A cycle is not drawable.
    for(let i=0;i<nodes.length;i++){
      let changed=false;
      for(const link of chart.links){const a=byId.get(link.source),b=byId.get(link.target);if(b.level<=a.level){b.level=a.level+1;changed=true;}}
      if(!changed)break;
      if(i===nodes.length-1){area.append(el('div','empty','流向包含循环，无法绘制。'));return;}
    }
    const levels=Array.from({length:Math.max(...nodes.map(n=>n.level))+1},(_,i)=>nodes.filter(n=>n.level===i));
    const maxCount=Math.max(...levels.map(a=>a.length)),h=Math.max(260,maxCount*26+70),w=Math.max(640,levels.length*170),gap=14,top=24,nodeW=12;
    const size=n=>Math.max(n.inScale,n.outScale);
    const scale=Math.min(...levels.filter(col=>col.some(size)).map(col=>(h-top-30-(col.length-1)*gap)/col.reduce((a,n)=>a+size(n),0)));
    levels.forEach((col,l)=>{
      let y=top;
      col.forEach(n=>{n.x=45+(w-90-nodeW)*(levels.length===1?0:l/(levels.length-1));n.y=y;n.height=Math.max(1,size(n)*scale);n.inOffset=0;n.outOffset=0;y+=n.height+gap;});
    });
    const graph=graphFor(chart,w,h);
    let tinyFlow=false;
    for(const link of chart.links){
      const a=byId.get(link.source),b=byId.get(link.target),thickness=(link.value/maxFlow)*scale;
      const y1=a.y+a.outOffset+thickness/2,y2=b.y+b.inOffset+thickness/2;
      a.outOffset+=thickness;b.inOffset+=thickness;
      if(thickness<.4)tinyFlow=true;
      const mid=(a.x+nodeW+b.x)/2,path=svg('path',{d:`M ${a.x+nodeW} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${b.x} ${y2}`,fill:'none',stroke:colors[a.index%colors.length],'stroke-width':Math.max(.4,thickness),'stroke-opacity':'.58'});
      graph.append(mark(path,'sankey',`${a.label} → ${b.label}: ${link.value} ${chart.unit}`,detail));
    }
    for(const n of nodes){
      const rect=svg('rect',{x:n.x,y:n.y,width:nodeW,height:n.height,fill:colors[n.index%colors.length]});
      graph.append(mark(rect,'sankey',`${n.label}: 流入约 ${numberText(n.incoming)} · 流出约 ${numberText(n.outgoing)} ${chart.unit}`,detail));
      svgText(graph,n.x+nodeW+4,n.y+12,String(n.index+1));
    }
    const wrap=el('div','svg-scroll');
    const wide=nodes.length>12 || levels.length>4;
    if(wide) {
      graph.classList.add('wide-chart');
      wrap.tabIndex=0;
      wrap.setAttribute('role','region');
      wrap.setAttribute('aria-label',chart.title+'，图形可左右滚动');
    }
    wrap.append(graph);area.append(wrap);
    const key=el('div','chart-key');
    nodes.forEach(n=>key.append(el('span','',`${n.index+1}. ${n.label}`)));
    const imbalance=nodes.filter(n=>n.incoming>0 && n.outgoing>0 && Math.abs(n.incoming-n.outgoing)>Number.EPSILON*Math.max(Math.abs(n.incoming),Math.abs(n.outgoing),Number.MIN_VALUE)*8);
    const imbalanceNote=imbalance.length
      ? '；不平衡：' + imbalance.map(n=>`${n.label} 流入约 ${numberText(n.incoming)}、流出约 ${numberText(n.outgoing)}`).join('；')
      : '';
    area.append(key,el('div','chart-note','流向和数量由来源给定；节点流入与流出不默认相等' + imbalanceNote + '。' + (tinyFlow?'极小流量使用最小线宽，具体数值请查看明细。':'') + (wide?'图形可左右滚动。':'')));
  }
  function eventsNode(events) {
    const box = el('section', 'events');
    box.append(el('h2', '', '事件时间线'));
    const list = el('ol', 'event-list');
    const sorted = events.map((event, index) => ({
      event,
      index,
      time: ns(event.timestamp)
    })).sort((a, b) => a.time < b.time ? -1 : a.time > b.time ? 1 : a.index - b.index);
    for (const {
      event: e
    } of sorted) {
      const item = el('li', 'event');
      item.dataset.status = e.status || 'unknown';
      item.append(el('div', 'event-time', stamp(e.timestamp)), el('div', 'event-title', e.label), el('div', 'event-context', [e.service, e.process].filter(Boolean).join(' · ')));
      if (e.detail) item.append(el('div', 'event-detail', e.detail));
      item.append(sourceRef(e.source_ids));
      list.append(item);
    }
    box.append(list);
    return box;
  }
  function sourcesNode(sources) {
    const box = el('details', 'sources'),
      summary = el('summary', '', `来源与范围 (${sources.length})`),
      list = el('div', 'source-list');
    for (const s of sources) {
      const item = el('div', 'source'),
        title = el('div', 'source-title', `${s.id} · ${s.tool}`),
        meta = el('div', 'source-meta', [sourceLabel(s), s.start || '开始时间未知', s.end || '结束时间未知', {
          complete: '完整',
          partial: '不完整',
          sample: '样本',
          unknown: '覆盖范围未知'
        }[s.coverage]].join(' · '));
      item.dataset.sourceId = s.id;
      item.append(title, meta);
      if (s.note) item.append(el('div', 'source-note', s.note));
      list.append(item);
    }
    box.append(summary, list);
    return box;
  }
  function scheduleResize() {
    if (resizePending) return;
    resizePending = true;
    requestAnimationFrame(() => {
      resizePending = false;
      if (initialized) send('ui/notifications/size-changed', {
        height: Math.ceil(root.getBoundingClientRect().height),
        width: document.documentElement.clientWidth
      });
    });
  }
  if (host === window) {
    status('请在支持 MCP App 的宿主中打开此分析视图。');
    return;
  }
  window.addEventListener('message', event => {
    if (event.source !== host || !event.data || event.data.jsonrpc !== '2.0') return;
    if (origin !== null && event.origin !== origin) return;
    const m = event.data;
    if (m.id === 1 && !initialized) {
      if (!m.result || typeof m.result !== 'object') {
        status('无法连接分析视图。', true);
        return;
      }
      origin = event.origin;
      initialized = true;
      theme(m.result.hostContext);
      send('ui/notifications/initialized');
      if (early && early.origin === origin) receive(early.params);
      early = null;
      scheduleResize();
    } else if (m.method === 'ui/notifications/tool-result') {
      if (!initialized) early = {
        origin: event.origin,
        params: m.params
      };else receive(m.params);
    } else if (initialized && m.method === 'ui/notifications/host-context-changed') theme(m.params);else if (initialized && m.method === 'ui/notifications/tool-cancelled') status('分析视图已取消。', true);
  });
  host.postMessage({
    jsonrpc: '2.0',
    id: 1,
    method: 'ui/initialize',
    params: {
      appInfo: {
        name: 'DerbySoft Log Analysis',
        version: '0.8.0'
      },
      appCapabilities: {},
      protocolVersion: '2026-01-26'
    }
  }, '*');
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(scheduleResize).observe(root);
})();
