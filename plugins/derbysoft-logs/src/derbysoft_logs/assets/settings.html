<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DerbySoft Logs 配置中心</title>
  <style>
    :root { color-scheme:light dark; --bg:#f6f8fb; --surface:#fff; --muted:#f5f7fa; --text:#1d2838; --sub:#66758a; --border:#dde4ed; --accent:#285acb; --accent-soft:#eaf1ff; --danger:#b42318; --wash:radial-gradient(ellipse at 92% -8%,#d5e7fb 0%,transparent 40%),linear-gradient(155deg,#f7fafc,#f4f7fb); }
    @media (prefers-color-scheme:dark) { :root { --bg:#111a27; --surface:#192435; --muted:#202d40; --text:#eaf0f8; --sub:#a5b2c3; --border:#344359; --accent:#a1bdff; --accent-soft:#233956; --danger:#ffaaa3; --wash:radial-gradient(ellipse at 92% -8%,#244366 0%,transparent 42%),linear-gradient(155deg,#121e2c,#111a27); } }
    :root[data-theme="light"] { color-scheme:light; --bg:#f6f8fb; --surface:#fff; --muted:#f5f7fa; --text:#1d2838; --sub:#66758a; --border:#dde4ed; --accent:#285acb; --accent-soft:#eaf1ff; --danger:#b42318; --wash:radial-gradient(ellipse at 92% -8%,#d5e7fb 0%,transparent 40%),linear-gradient(155deg,#f7fafc,#f4f7fb); }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#111a27; --surface:#192435; --muted:#202d40; --text:#eaf0f8; --sub:#a5b2c3; --border:#344359; --accent:#a1bdff; --accent-soft:#233956; --danger:#ffaaa3; --wash:radial-gradient(ellipse at 92% -8%,#244366 0%,transparent 42%),linear-gradient(155deg,#121e2c,#111a27); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--wash); color:var(--text); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { width:min(100%,760px); margin:auto; padding:22px 24px 92px; }
    .intro { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px; }
    h1 { margin:0; font-size:21px; letter-spacing:-.02em; line-height:1.25; }
    h2 { font-size:14px; line-height:1.35; margin:0; }
    p { margin:0; }
    button, input, select { font:inherit; }
    button { cursor:pointer; border-radius:8px; min-height:34px; padding:6px 12px; font-weight:600; border:1px solid var(--border); color:var(--text); background:var(--surface); }
    button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid color-mix(in srgb,var(--accent) 28%,transparent); outline-offset:1px; }
    button:disabled { cursor:not-allowed; opacity:.55; }
    .primary { color:white; background:#315eea; border-color:#315eea; }
    .primary:hover:not(:disabled) { color:white; background:#2548bb; border-color:#2548bb; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; margin:10px 0; overflow:hidden; }
    .card-head { padding:15px 16px 0; }
    .card-body { padding:14px 16px 16px; }
    .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px 16px; }
    .field { display:flex; flex-direction:column; gap:5px; min-width:0; }
    .field label { font-size:13px; font-weight:650; }
    .field small { color:var(--sub); line-height:1.4; overflow-wrap:anywhere; }
    input:not([type="checkbox"]),select { width:100%; min-width:0; height:38px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); padding:7px 10px; }
    input:not([type="checkbox"]):hover,select:hover { border-color:var(--accent); }
    input:disabled,select:disabled { opacity:.7; }
    .check { flex-direction:row; align-items:center; gap:8px; }
    .check input { width:17px; height:17px; accent-color:var(--accent); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .actions:only-child { margin-top:0; }
    .action-wrap { display:flex; flex-direction:column; align-items:flex-start; max-width:100%; gap:4px; }
    .result { border-radius:8px; padding:10px 12px; margin-top:14px; background:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere; color:var(--sub); }
    .result:empty { display:none; }
    .notice { border-radius:10px; margin:12px 0; padding:12px 14px; background:var(--accent-soft); color:var(--text); white-space:pre-line; }
    .notice.error { color:var(--danger); background:var(--surface); border:1px solid var(--danger); }
    .notice:empty { display:none; }
    .footer { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); }
    .footer-inner { width:min(100%,760px); margin:auto; padding:10px 24px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .footer-status { color:var(--sub); font-size:13px; }
    .footer-buttons { display:flex; gap:9px; }
    .loading { color:var(--sub); padding:25px 2px; }
    .picker-row { display:flex; gap:8px; align-items:end; }
    .picker-row .field { flex:1; }
    .picker-row button { flex:none; height:38px; }
    .env-actions { display:flex; flex-wrap:wrap; gap:8px; margin:13px 0 2px; }
    button.danger-link { color:var(--danger); border-color:transparent; background:transparent; font-weight:500; margin-left:auto; }
    button.danger-link:hover:not(:disabled) { color:var(--danger); border-color:var(--danger); }
    dialog { width:min(400px,calc(100% - 32px)); margin:auto; padding:20px; border:1px solid var(--border); border-radius:12px; color:var(--text); background:var(--surface); box-shadow:0 18px 60px #0005; }
    dialog::backdrop { background:rgba(8,15,25,.58); }
    dialog h2 { font-size:17px; }
    dialog p { margin:12px 0 0; line-height:1.5; }
    dialog .impact { color:var(--danger); font-size:13px; }
    dialog label { display:block; font-size:13px; font-weight:600; margin-top:16px; }
    dialog input { margin-top:5px; }
    dialog .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
    dialog .danger { color:#fff; border-color:#b42318; background:#b42318; }
    dialog .danger:hover:not(:disabled) { color:#fff; background:#912018; border-color:#912018; }
    dialog .dialog-error { color:var(--danger); font-size:13px; overflow-wrap:anywhere; }
    dialog .dialog-error:empty { display:none; }
    .result-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .result-environment { color:var(--sub); font-size:13px; overflow-wrap:anywhere; }
    .service-result { border:1px solid var(--border); border-radius:9px; margin-top:10px; padding:11px 12px; }
    .service-result h3 { margin:0; font-size:13px; }
    .service-result p { margin:4px 0 0; font-size:13px; color:var(--sub); overflow-wrap:anywhere; }
    .service-result p.problem { color:var(--danger); }
    .secret-field { grid-column:1/-1; }
    .service { border-top:1px solid var(--border); }
    .service:first-child { border-top:0; }
    .service summary { display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; list-style:none; padding:13px 16px; font-weight:650; }
    .service summary::-webkit-details-marker { display:none; }
    .service summary::after { content:"›"; color:var(--sub); font-size:19px; font-weight:400; line-height:1; transform:rotate(90deg); }
    .service[open] summary::after { transform:rotate(-90deg); }
    .service .fields { padding:0 16px 16px; }
    .empty { padding:20px 16px; color:var(--sub); }
    @media (max-width:620px) { main { padding:18px 16px 88px; } .fields { grid-template-columns:1fr; } .footer-inner { padding:10px 16px; } .footer-status { max-width:43%; } }
  </style>
</head>
<body>
  <main>
    <div class="intro"><h1>日志设置</h1><button type="button" id="reload">刷新</button></div>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <form id="settings-form" novalidate><div id="groups" class="loading">正在连接配置服务…</div></form>
  </main>
  <div class="footer"><div class="footer-inner">
    <span id="footer-status" class="footer-status" aria-live="polite">等待配置服务</span>
    <div class="footer-buttons"><button type="button" id="discard" disabled>放弃修改</button><button type="submit" form="settings-form" class="primary" id="save" disabled>保存更改</button></div>
  </div></div>
  <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
    <h2 id="delete-title">删除环境</h2>
    <p id="delete-description">将删除 <strong id="delete-name"></strong> 的连接配置及已关联的凭证。</p>
    <p id="delete-impact" class="impact"></p>
    <label for="delete-confirmation">输入环境名称确认</label>
    <input id="delete-confirmation" type="text" autocomplete="off" spellcheck="false">
    <p id="delete-error" class="dialog-error" role="alert"></p>
    <div class="dialog-actions"><button type="button" id="delete-cancel">取消</button><button type="button" id="delete-submit" class="danger" disabled>删除环境</button></div>
  </dialog>
  <dialog id="connection-dialog" aria-labelledby="connection-title">
    <div class="result-heading"><h2 id="connection-title">连接结果</h2><span id="connection-environment" class="result-environment"></span></div>
    <div id="connection-results"></div>
    <div class="dialog-actions"><button type="button" id="connection-close">关闭</button></div>
  </dialog>
  <script>
  (() => {
    "use strict";
    const host = window.parent;
    const pending = new Map();
    let nextId = 1, hostOrigin = null, initialized = false, busy = false;
    let state = null, baseline = {}, draft = {}, selectedEnvironment = null, addingEnvironment = false, syncNeeded = false, revisionSnapshot = null;
    let secretDraft = Object.create(null);
    let deletePreview = null, queuedAction = null, deleteInFlight = false;
    const expandedServices = new Set(["opensearch"]);
    const form = document.getElementById("settings-form");
    const groupsNode = document.getElementById("groups");
    const notice = document.getElementById("notice");
    const footerStatus = document.getElementById("footer-status");
    const saveButton = document.getElementById("save");
    const discardButton = document.getElementById("discard");
    const reloadButton = document.getElementById("reload");
    const deleteDialog = document.getElementById("delete-dialog");
    const deleteName = document.getElementById("delete-name");
    const deleteImpact = document.getElementById("delete-impact");
    const deleteConfirmation = document.getElementById("delete-confirmation");
    const deleteError = document.getElementById("delete-error");
    const deleteCancel = document.getElementById("delete-cancel");
    const deleteSubmit = document.getElementById("delete-submit");
    const connectionDialog = document.getElementById("connection-dialog");
    const connectionEnvironment = document.getElementById("connection-environment");
    const connectionResults = document.getElementById("connection-results");
    const connectionClose = document.getElementById("connection-close");

    function send(message) { host.postMessage(message, hostOrigin && hostOrigin !== "null" ? hostOrigin : "*"); }
    class ToolFailure extends Error {}
    class TransportFailure extends Error {}
    function request(method, params, timeoutMs = 30000) {
      const id = nextId++;
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => { pending.delete(id); reject(new TransportFailure("连接超时，请重新读取或在原生设置中重试。")); }, timeoutMs);
        pending.set(id, {resolve, reject, timer, method});
        send({jsonrpc:"2.0", id, method, params});
      });
    }
    function notify(method, params) { const msg = {jsonrpc:"2.0", method}; if (params !== undefined) msg.params = params; send(msg); }
    function setTheme(context) {
      if (context && (context.theme === "dark" || context.theme === "light")) document.documentElement.dataset.theme = context.theme;
    }
    window.addEventListener("message", event => {
      // MCP host messages are accepted only from the parent window. Pin the
      // initial response origin for the rest of the session; opaque sandbox
      // origins use "null", so source checking remains mandatory there.
      if (event.source !== host || !event.data || event.data.jsonrpc !== "2.0") return;
      if (hostOrigin !== null && event.origin !== hostOrigin) return;
      const message = event.data;
      if (typeof message.id === "number" && pending.has(message.id)) {
        const item = pending.get(message.id);
        if (hostOrigin === null) {
          if (item.method !== "ui/initialize" || (!message.error && (!message.result || typeof message.result !== "object"))) return;
          hostOrigin = event.origin;
        }
        pending.delete(message.id); clearTimeout(item.timer);
        if (message.error) item.reject(new TransportFailure(String(message.error.message || "请求失败")));
        else item.resolve(message.result);
      } else if (message.method === "ui/notifications/tool-result") {
        const action = parseUiAction(message.params);
        if (!action) return;
        if (!initialized || !state) queuedAction = {action, origin:event.origin};
        else dispatchUiAction(action);
      } else if (initialized && message.method === "ui/notifications/host-context-changed") setTheme(message.params);
    });

    function describeError(error) { return String(error && error.message || error || "请求失败").slice(0, 1000); }
    function setNotice(message, isError = false) { notice.textContent = message; notice.classList.toggle("error", isError); }
    function unpack(result) {
      if (!result || typeof result !== "object") throw new Error("配置服务返回了无效响应。");
      if (result.isError) {
        const message = (result.content || []).filter(x => x && x.type === "text").map(x => x.text).join(" ");
        throw new ToolFailure(message || "配置服务拒绝了请求。");
      }
      if (result.structuredContent && typeof result.structuredContent === "object") return result.structuredContent;
      for (const item of result.content || []) if (item && item.type === "text") {
        try { const value = JSON.parse(item.text); if (value && typeof value === "object") return value; } catch (_) { /* Not structured JSON. */ }
      }
      return {};
    }
    async function callTool(name, args = {}) { return unpack(await request("tools/call", {name, arguments:args}, name.startsWith("test_connection__") ? 90000 : 30000)); }
    function parseDeletePreview(result) {
      if (!result || typeof result !== "object" || result.isError) return null;
      const value = result.structuredContent;
      if (!value || typeof value !== "object" || value.action !== "confirm_delete" ||
          typeof value.environment !== "string" || !/^[A-Za-z0-9_-]{1,64}$/.test(value.environment) ||
          typeof value.default_environment !== "boolean") return null;
      return {environment:value.environment, default_environment:value.default_environment};
    }
    function parseUiAction(result) {
      const preview = parseDeletePreview(result);
      if (preview) return {action:"confirm_delete", ...preview};
      const value = result && !result.isError && result.structuredContent;
      if (!value || typeof value !== "object" || !["edit_environment", "connection_result"].includes(value.action) ||
          typeof value.environment !== "string" || !/^[A-Za-z0-9_-]{1,64}$/.test(value.environment)) return null;
      return value;
    }
    function knownEnvironment(id) {
      return Boolean(state && (state.layout || []).some(group => (group.items || []).some(item => item.kind === "tool" && item.tool === "configure_credentials__" + id)));
    }
    function dispatchUiAction(action) {
      if (!state || !initialized || syncNeeded || deleteDialog.open || connectionDialog.open) { queuedAction = {action, origin:hostOrigin}; return; }
      if (!knownEnvironment(action.environment)) { setNotice("该环境不存在或设置已变更，请刷新后重试。", true); return; }
      if (action.action === "confirm_delete") openDeleteDialog(action);
      else if (action.action === "edit_environment") {
        selectedEnvironment = action.environment; addingEnvironment = false; expandedServices.add("opensearch"); render();
        requestAnimationFrame(() => document.getElementById("secret-" + action.environment + "-opensearch")?.focus());
      } else if (action.action === "connection_result") openConnectionDialog(action);
    }
    function openDeleteDialog(preview) {
      if (!state || syncNeeded) { queuedAction = {action:{action:"confirm_delete", ...preview}, origin:hostOrigin}; return; }
      const exists = (state.layout || []).some(group => (group.items || []).some(item => item.kind === "tool" && item.tool === "request_delete__" + preview.environment));
      if (!exists) { setNotice("该环境不存在或设置已变更，请刷新后重试。", true); return; }
      if (deleteDialog.open) {
        if (deletePreview && deletePreview.environment === preview.environment) return;
        queuedAction = {action:{action:"confirm_delete", ...preview}, origin:hostOrigin}; return;
      }
      deletePreview = preview;
      deleteName.textContent = preview.environment;
      deleteImpact.textContent = preview.default_environment ? "这是默认环境，删除后会清空默认环境。" :
        draft.default_environment === preview.environment ? "未保存的默认环境选择也会清除。" : "";
      deleteConfirmation.value = ""; deleteError.textContent = ""; deleteSubmit.disabled = true;
      deleteDialog.showModal(); deleteConfirmation.focus();
    }
    function flushUiAction() {
      if (!queuedAction || !initialized || !state || syncNeeded || deleteDialog.open || connectionDialog.open) return;
      const queued = queuedAction; queuedAction = null;
      if (queued.origin === hostOrigin) dispatchUiAction(queued.action);
    }
    function diff() { const changes = {}; for (const key of Object.keys(draft)) if (!Object.is(draft[key], baseline[key])) changes[key] = draft[key]; return changes; }
    function secretCount() { return Object.values(secretDraft).reduce((count, services) => count + Object.values(services).filter(Boolean).length, 0); }
    function environmentHasChanges(environment) {
      return Object.keys(diff()).some(key => environmentForField(key) === environment) || Object.values(secretDraft[environment] || {}).some(Boolean);
    }
    function showState() {
      const count = Object.keys(diff()).length + secretCount();
      footerStatus.textContent = busy ? "正在处理…" : syncNeeded ? "请刷新设置" : !state ? "尚未连接" : count ? `${count} 项未保存` : "已保存";
      saveButton.disabled = busy || syncNeeded || !state || !count;
      discardButton.disabled = busy || syncNeeded || !state || !count;
      reloadButton.disabled = busy;
      for (const element of groupsNode.querySelectorAll("input,select,button")) element.disabled = busy || syncNeeded;
      for (const button of groupsNode.querySelectorAll("button[data-test-environment]")) {
        button.textContent = environmentHasChanges(button.dataset.testEnvironment) ? "保存并测试" : "测试连接";
      }
    }
    function setBusy(value) { busy = value; showState(); }
    function labelForAction(item) {
      if (typeof item.title === "string" && item.title.trim()) return item.title;
      if (item.tool === "create_environment") return "新增环境";
      if (item.tool.startsWith("configure_credentials__")) return "配置凭证";
      if (item.tool.startsWith("test_connection__")) return "测试连接";
      if (item.tool.startsWith("request_delete__")) return "删除";
      return item.tool;
    }
    function field(key, schema) {
      const wrapper = document.createElement("div"); wrapper.className = "field";
      const id = "field-" + key;
      const label = document.createElement("label"); label.htmlFor = id;
      label.textContent = (schema.title || key).replace(/^(OpenSearch|StreamLog|Loki) /, "");
      let control;
      if (Array.isArray(schema.enum)) {
        control = document.createElement("select");
        for (const value of schema.enum) {
          const option = document.createElement("option"); option.value = String(value);
          option.textContent = value === "" ? "未设置" : ({uat:"UAT",prod:"PROD",qa:"QA",dev:"DEV",custom:"自定义"}[value] || String(value));
          control.appendChild(option);
        }
        if (!schema.enum.includes(draft[key])) {
          const option = document.createElement("option"); option.value = String(draft[key] ?? ""); option.textContent = String(draft[key] ?? "") + "（当前值）"; control.appendChild(option);
        }
      } else {
        control = document.createElement("input");
        control.type = schema.type === "boolean" ? "checkbox" : (schema.type === "number" || schema.type === "integer" ? "number" : "text");
        if (typeof schema.minLength === "number") control.minLength = schema.minLength;
        if (typeof schema.maxLength === "number") control.maxLength = schema.maxLength;
        if (typeof schema.pattern === "string") control.pattern = schema.pattern;
        if (typeof schema.minimum === "number") control.min = String(schema.minimum);
        if (typeof schema.maximum === "number") control.max = String(schema.maximum);
        if (schema.type === "integer") control.step = "1";
        else if (schema.type === "number") control.step = "any";
      }
      control.id = id; control.name = key; control.autocomplete = "off";
      if (key === "new_environment_id") control.placeholder = "如 uat、prod";
      if (key.endsWith("__streamlog__default_client")) control.placeholder = "选填";
      if (schema.type === "boolean") { control.checked = Boolean(draft[key]); wrapper.classList.add("check"); }
      else control.value = String(draft[key] ?? "");
      if ((state.schema.required || []).includes(key)) control.required = true;
      const warning = document.createElement("small");
      const changedConnection = () => {
        if (!String(baseline[key] || "") || Object.is(draft[key], baseline[key])) { warning.textContent = ""; return; }
        if (key.endsWith("__opensearch__url")) warning.textContent = "更改地址后需重新输入已保存的凭证；未同时修改的默认索引也会清除。";
        else if (key.endsWith("__streamlog__url")) warning.textContent = "更改地址后需重新输入已保存的凭证；未同时修改的默认 client 也会清除。";
        else if (key.endsWith("__url") || key.endsWith("__username") || key.endsWith("__auth_type")) warning.textContent = "更改后需重新输入已保存的凭证。";
      };
      const update = () => {
        if (schema.type === "boolean") draft[key] = control.checked;
        else if (schema.type === "number" || schema.type === "integer") draft[key] = control.value === "" ? "" : Number(control.value);
        else draft[key] = control.value;
        if (key.endsWith("__loki__auth_type")) {
          const environment = environmentForField(key);
          const input = document.getElementById(`secret-${environment}-loki`);
          if (input) input.placeholder = draft[key] === "none" ? "无需认证，请留空" : state.metadata?.environments?.[environment]?.loki?.has_secret ? "已保存，留空保持" : "未设置";
        }
        changedConnection(); setNotice(""); showState();
      };
      control.addEventListener("input", update); control.addEventListener("change", update);
      wrapper.appendChild(label); wrapper.appendChild(control);
      changedConnection(); wrapper.appendChild(warning);
      if (key === "default_environment" && typeof schema.description === "string" && /当前默认设置无效|环境变量/.test(schema.description)) {
        const help = document.createElement("small"); help.textContent = schema.description; wrapper.appendChild(help);
      }
      return wrapper;
    }
    function secretField(environment, service) {
      const wrapper = document.createElement("div"); wrapper.className = "field secret-field";
      const id = `secret-${environment}-${service}`;
      const label = document.createElement("label"); label.htmlFor = id;
      const mode = draft[`env__${environment}__loki__auth_type`] || "basic";
      label.textContent = service === "streamlog" ? "Authorization" : service === "loki" ? "密码 / Token" : "密码";
      const input = document.createElement("input"); input.type = "password"; input.id = id; input.autocomplete = "new-password"; input.maxLength = 4096;
      const hasSecret = state.metadata?.environments?.[environment]?.[service]?.has_secret;
      input.placeholder = service === "loki" && mode === "none" ? "无需认证，请留空" : hasSecret ? "已保存，留空保持" : "未设置";
      input.value = secretDraft[environment]?.[service] || "";
      input.addEventListener("input", () => {
        if (!secretDraft[environment]) secretDraft[environment] = Object.create(null);
        if (input.value) secretDraft[environment][service] = input.value;
        else { delete secretDraft[environment][service]; if (!Object.keys(secretDraft[environment]).length) delete secretDraft[environment]; }
        setNotice(""); showState();
      });
      wrapper.append(label, input); return wrapper;
    }
    function formatResult(result, action) {
      const environment = typeof result.environment === "string" ? result.environment : "当前环境";
      if (action === "create_environment") return `已创建环境 ${environment}。`;
      return "操作已完成。";
    }
    function openConnectionDialog(result) {
      connectionEnvironment.textContent = result.environment;
      connectionResults.replaceChildren();
      const indexMessages = {
        ok:"默认索引查询通过", missing_default_index:"未配置默认索引", index_not_found:"默认索引不存在",
        unauthorized:"认证失败，请检查凭证", forbidden:"没有默认索引的查询权限", partial:"查询不完整，部分分片失败",
        timeout:"查询超时", invalid_response:"响应无效，无法确认权限", query_failed:"查询失败", invalid_index:"默认索引无效",
        no_shards:"未命中分片，无法确认索引权限", not_checked:"尚未测试索引查询", not_configured:"未配置"
      };
      for (const [key, title] of [["opensearch", "OpenSearch"], ["streamlog", "StreamLog"], ["loki", "Loki"]]) {
        const status = result[key] && typeof result[key] === "object" ? result[key] : {};
        let message;
        if (key === "opensearch") message = indexMessages[status.index_query_status] || (status.configured ? "索引查询状态未知" : "未配置");
        else if (!status.configured) message = "未配置";
        else if (key === "streamlog") message = "已配置；查询权限尚未验证";
        else if (status.reachable === false) message = "连接失败，请检查网络和凭证";
        else if (status.labels_accessible) message = "标签接口可访问";
        else if (status.http_status) message = `接口返回 HTTP ${status.http_status}`;
        else message = "已配置；尚未验证";
        const card = document.createElement("section"); card.className = "service-result";
        const heading = document.createElement("h3"); heading.textContent = title;
        const description = document.createElement("p"); description.textContent = message;
        if (["unauthorized", "forbidden", "timeout", "invalid_response", "query_failed", "invalid_index"].includes(status.index_query_status) || status.reachable === false) description.className = "problem";
        card.append(heading, description);
        if (key === "opensearch" && typeof status.index === "string" && status.index) {
          const index = document.createElement("p"); index.textContent = status.index; card.appendChild(index);
        }
        connectionResults.appendChild(card);
      }
      connectionDialog.showModal(); connectionClose.focus();
    }
    function render() {
      groupsNode.replaceChildren(); groupsNode.className = "";
      const definitions = state.schema.properties || {};
      const layouts = Array.isArray(state.layout) ? state.layout : [];
      const environmentGroups = layouts.flatMap(group => {
        const action = (group.items || []).find(item => item.kind === "tool" && typeof item.tool === "string" && item.tool.startsWith("configure_credentials__"));
        return action ? [{id:action.tool.slice("configure_credentials__".length), group}] : [];
      });
      const newGroup = layouts.find(group => (group.items || []).some(item => item.property === "new_environment_id"));
      const ids = environmentGroups.map(item => item.id);
      if (!ids.includes(selectedEnvironment)) selectedEnvironment = ids.includes(draft.default_environment) ? draft.default_environment : (ids[0] || null);
      if (!ids.length) addingEnvironment = true;

      function section(title) {
        const card = document.createElement("section"); card.className = "card";
        const body = document.createElement("div"); body.className = "card-body";
        if (title) { const head = document.createElement("div"); head.className = "card-head"; const heading = document.createElement("h2"); heading.textContent = title; head.appendChild(heading); card.appendChild(head); }
        card.appendChild(body); groupsNode.appendChild(card); return body;
      }
      function appendAction(container, item) {
        const button = document.createElement("button"); button.type = "button"; button.textContent = labelForAction(item);
        if (item.tool.startsWith("request_delete__")) button.className = "danger-link";
        if (item.tool.startsWith("test_connection__")) button.dataset.testEnvironment = item.tool.slice("test_connection__".length);
        button.addEventListener("click", () => runAction(item.tool)); container.appendChild(button);
      }
      const nav = section("");
      if (ids.length) {
        const row = document.createElement("div"); row.className = "picker-row";
        const wrapper = document.createElement("div"); wrapper.className = "field";
        const label = document.createElement("label"); label.htmlFor = "active-environment"; label.textContent = "编辑环境";
        const select = document.createElement("select"); select.id = "active-environment";
        for (const {id, group} of environmentGroups) {
          const option = document.createElement("option"); option.value = id; option.textContent = group.title || id; select.appendChild(option);
        }
        select.value = selectedEnvironment;
        select.addEventListener("change", () => { selectedEnvironment = select.value; addingEnvironment = false; render(); });
        wrapper.append(label,select); row.appendChild(wrapper);
        const add = document.createElement("button"); add.type = "button"; add.textContent = addingEnvironment ? "取消" : "新增";
        add.addEventListener("click", () => { addingEnvironment = !addingEnvironment; render(); }); row.appendChild(add); nav.appendChild(row);
      }
      if (definitions.default_environment) {
        const defaultField = field("default_environment", definitions.default_environment);
        if (ids.length) defaultField.style.marginTop = "13px";
        nav.appendChild(defaultField);
      }
      if (selectedEnvironment && !addingEnvironment) {
        const group = environmentGroups.find(item => item.id === selectedEnvironment).group;
        const actionRow = document.createElement("div"); actionRow.className = "env-actions";
        for (const item of group.items) if (item.kind === "tool" && typeof item.tool === "string" && !item.tool.startsWith("configure_credentials__")) appendAction(actionRow, item);
        nav.appendChild(actionRow);
      }
      if (addingEnvironment && newGroup) {
        const body = section("新增环境");
        const fields = document.createElement("div"); fields.className = "fields";
        const actions = document.createElement("div"); actions.className = "actions";
        for (const item of newGroup.items) {
          if (item.kind === "property" && definitions[item.property]) fields.appendChild(field(item.property, definitions[item.property]));
          else if (item.kind === "tool" && typeof item.tool === "string") appendAction(actions, item);
        }
        body.append(fields, actions);
      } else if (selectedEnvironment) {
        const group = environmentGroups.find(item => item.id === selectedEnvironment).group;
        const prefix = `env__${selectedEnvironment}__`;
        const serviceCard = document.createElement("section"); serviceCard.className = "card";
        for (const [kind, title] of [["opensearch", "OpenSearch"], ["streamlog", "StreamLog"], ["loki", "Loki"]]) {
          const keys = group.items.filter(item => item.kind === "property" && typeof item.property === "string" && item.property.startsWith(prefix) &&
            item.property.startsWith(prefix + kind + "__"))
            .map(item => item.property).filter(key => definitions[key]);
          if (!keys.length) continue;
          const details = document.createElement("details"); details.className = "service"; details.open = expandedServices.has(kind);
          const summary = document.createElement("summary"); summary.textContent = title; details.appendChild(summary);
          const fields = document.createElement("div"); fields.className = "fields";
          let secretAdded = false;
          for (const key of keys) {
            fields.appendChild(field(key, definitions[key]));
            if ((kind === "streamlog" && key.endsWith("__url")) || (kind !== "streamlog" && key.endsWith("__username"))) {
              fields.appendChild(secretField(selectedEnvironment, kind)); secretAdded = true;
            }
          }
          if (!secretAdded) fields.appendChild(secretField(selectedEnvironment, kind));
          details.appendChild(fields);
          details.addEventListener("toggle", () => { if (details.open) expandedServices.add(kind); else expandedServices.delete(kind); });
          serviceCard.appendChild(details);
        }
        if (serviceCard.children.length) groupsNode.appendChild(serviceCard);
      }
      showState();
    }
    function validateState(data) {
      if (!data || !data.schema || typeof data.schema !== "object" || !data.schema.properties || typeof data.values !== "object" || Array.isArray(data.values) ||
          !data.metadata || typeof data.metadata.settings_revision !== "string" || !data.metadata.environments || typeof data.metadata.environments !== "object") throw new Error("配置服务返回的设置结构或版本无效，请更新插件。");
      for (const key of Object.keys(data.schema.properties)) if (!(key in data.values)) throw new Error("配置服务缺少设置值：" + key);
      return data;
    }
    function environmentIds(data = state) {
      return (data?.layout || []).flatMap(group => (group.items || []).filter(item => item.kind === "tool" && typeof item.tool === "string" && item.tool.startsWith("configure_credentials__")).map(item => item.tool.slice("configure_credentials__".length)));
    }
    function environmentForField(key, ids = environmentIds()) {
      return [...ids].sort((a, b) => b.length - a.length).find(id => key.startsWith(`env__${id}__`));
    }
    async function readSettings(preserveDraft = false, knownSettingsMutation = false, resolveConflicts = false) {
      const previous = preserveDraft ? diff() : {};
      const previousRevisions = revisionSnapshot;
      const previousIds = environmentIds();
      const dirtyEnvironmentIds = new Set(Object.keys(secretDraft));
      for (const key of Object.keys(previous)) { const id = environmentForField(key); if (id) dirtyEnvironmentIds.add(id); }
      const hadPending = Object.keys(previous).length > 0 || secretCount() > 0;
      const data = validateState(await callTool("settings_read"));
      const conflicts = [];
      if (resolveConflicts && previousRevisions) {
        for (const id of dirtyEnvironmentIds) {
          if (previousRevisions.environments[id] !== data.metadata.environments[id]?.revision) {
            for (const key of Object.keys(previous)) if (environmentForField(key, previousIds) === id) delete previous[key];
            delete secretDraft[id]; conflicts.push(id);
          }
        }
        if (Object.hasOwn(previous, "default_environment") && previousRevisions.settings_revision !== data.metadata.settings_revision) {
          delete previous.default_environment; conflicts.push("默认环境");
        }
      }
      state = data; baseline = {...data.values}; draft = {...data.values};
      for (const [key, value] of Object.entries(previous)) {
        const schema = data.schema.properties[key];
        if (schema && (!Array.isArray(schema.enum) || schema.enum.includes(value))) draft[key] = value;
      }
      const ids = environmentIds(data);
      for (const id of Object.keys(secretDraft)) if (!ids.includes(id)) delete secretDraft[id];
      const hasPendingDefault = Object.hasOwn(previous, "default_environment") &&
        (!Array.isArray(data.schema.properties.default_environment?.enum) || data.schema.properties.default_environment.enum.includes(previous.default_environment));
      revisionSnapshot = {settings_revision:preserveDraft && !resolveConflicts && hadPending && previousRevisions && (!knownSettingsMutation || hasPendingDefault) ? previousRevisions.settings_revision : data.metadata.settings_revision, environments:Object.create(null)};
      for (const id of ids) {
        const current = data.metadata.environments[id]?.revision;
        const prior = previousRevisions?.environments?.[id];
        if (typeof current !== "string") throw new Error("环境配置版本无效，请刷新设置。");
        revisionSnapshot.environments[id] = preserveDraft && !resolveConflicts && dirtyEnvironmentIds.has(id) && typeof prior === "string" ? prior : current;
      }
      render();
      return conflicts;
    }
    function identityChanged(environment, service, changes) {
      const fields = service === "loki" ? ["url", "username", "auth_type"] : service === "opensearch" ? ["url", "username"] : ["url"];
      return fields.some(field => {
        const key = `env__${environment}__${service}__${field}`;
        if (!(key in changes)) return false;
        const oldValue = String(baseline[key] ?? ""), newValue = String(changes[key] ?? "");
        return field === "url" ? oldValue.replace(/\/+$/, "") !== newValue.replace(/\/+$/, "") : oldValue !== newValue;
      });
    }
    function validateSecrets(changes, secrets, targets) {
      for (const environment of targets) for (const service of ["opensearch", "streamlog", "loki"]) {
        const secret = secrets[environment]?.[service] || "";
        const mode = draft[`env__${environment}__loki__auth_type`] || "basic";
        if (service === "loki" && mode === "none" && secret) throw new Error(`${environment} 的 Loki 无需认证，请清空凭证后保存。`);
        const saved = state.metadata.environments[environment]?.[service]?.has_secret;
        const url = draft[`env__${environment}__${service}__url`] || "";
        if (saved && url && !(service === "loki" && mode === "none") && identityChanged(environment, service, changes) && !secret) {
          throw new Error(`${environment} 的 ${service} 连接已更改，请重新输入凭证。`);
        }
      }
    }
    function bytesFromBase64(value) {
      const decoded = atob(value); return Uint8Array.from(decoded, character => character.charCodeAt(0));
    }
    function base64FromBytes(value) {
      const bytes = new Uint8Array(value); let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary);
    }
    async function secureSave(changes, secrets) {
      if (!globalThis.isSecureContext || !globalThis.crypto?.subtle) throw new Error("当前配置窗口不支持安全加密，请在支持的 Codex 版本中打开设置。");
      if (!revisionSnapshot || typeof revisionSnapshot.settings_revision !== "string") throw new Error("缺少配置版本，请刷新后重试。");
      const ids = environmentIds();
      const targets = new Set(Object.keys(secrets));
      for (const key of Object.keys(changes)) { const id = environmentForField(key, ids); if (id) targets.add(id); }
      if (ids.includes(changes.default_environment)) targets.add(changes.default_environment);
      validateSecrets(changes, secrets, targets);
      const expected = Object.create(null);
      for (const id of targets) {
        if (typeof revisionSnapshot.environments[id] !== "string") throw new Error(`环境 ${id} 的配置版本不可用，请刷新设置。`);
        expected[id] = revisionSnapshot.environments[id];
      }
      let session;
      try { session = await callTool("begin_settings_save", {environments:[...targets], expected_revisions:expected, expected_settings_revision:revisionSnapshot.settings_revision}); }
      catch (error) {
        if (/已改变|已变化|版本冲突/.test(describeError(error))) syncNeeded = true;
        throw error;
      }
      if (!session || typeof session.session_id !== "string" || typeof session.public_key_spki !== "string") throw new Error("安全配置会话无效，请重试。");
      let rawKey, plain;
      try {
        const subtle = globalThis.crypto.subtle;
        const key = await subtle.generateKey({name:"AES-GCM", length:256}, true, ["encrypt"]);
        rawKey = new Uint8Array(await subtle.exportKey("raw", key));
        const publicKey = await subtle.importKey("spki", bytesFromBase64(session.public_key_spki), {name:"RSA-OAEP", hash:"SHA-256"}, false, ["encrypt"]);
        const encryptedKey = await subtle.encrypt({name:"RSA-OAEP"}, publicKey, rawKey);
        const iv = globalThis.crypto.getRandomValues(new Uint8Array(12));
        plain = new TextEncoder().encode(JSON.stringify({set:changes, secrets}));
        const ciphertext = await subtle.encrypt({name:"AES-GCM", iv, additionalData:new TextEncoder().encode(session.session_id), tagLength:128}, key, plain);
        try {
          return await callTool("save_settings_secure", {session_id:session.session_id, encrypted_key:base64FromBytes(encryptedKey), iv:base64FromBytes(iv), ciphertext:base64FromBytes(ciphertext)});
        } catch (error) {
          if (error instanceof TransportFailure || /回滚未完成|rollback was incomplete|已改变|已变化|版本冲突/i.test(describeError(error))) {
            syncNeeded = true;
            throw new Error(error instanceof TransportFailure ? "保存结果未知，请刷新后检查设置。" : describeError(error));
          }
          throw error;
        }
      } finally { if (rawKey) rawKey.fill(0); if (plain) plain.fill(0); }
    }
    async function saveChanges(filter = () => true, secretFilter = () => true) {
      const allChanges = diff();
      const changes = Object.fromEntries(Object.entries(allChanges).filter(([key]) => filter(key)));
      const secrets = Object.create(null);
      for (const [id, services] of Object.entries(secretDraft)) if (secretFilter(id)) {
        const submitted = Object.fromEntries(Object.entries(services).filter(([, value]) => Boolean(value)));
        if (Object.keys(submitted).length) secrets[id] = submitted;
      }
      if (!Object.keys(changes).length && !Object.keys(secrets).length) return false;
      for (const key of Object.keys(changes)) {
        const control = document.getElementById("field-" + key);
        if (control && !control.checkValidity()) { control.closest("details")?.setAttribute("open", ""); control.reportValidity(); throw new Error("请检查标记的设置项。"); }
      }
      const updated = await secureSave(changes, secrets);
      if (!updated || updated.saved !== true) throw new Error("配置服务未确认保存，已保留未保存的修改。");
      // The server may normalize a value (for example, strip a trailing slash).
      // It must acknowledge each submitted key; its saved values are authoritative.
      for (const [id, services] of Object.entries(secrets)) {
        for (const service of Object.keys(services)) delete secretDraft[id][service];
        if (!Object.keys(secretDraft[id]).length) delete secretDraft[id];
      }
      // Saved secrets are removed from the DOM even if the subsequent refresh fails.
      for (const [id, services] of Object.entries(secrets)) for (const service of Object.keys(services)) {
        const input = document.getElementById(`secret-${id}-${service}`); if (input) input.value = "";
      }
      if (!updated.values || typeof updated.values !== "object" || Array.isArray(updated.values) || Object.keys(changes).some(key => !(key in updated.values))) {
        for (const key of Object.keys(changes)) baseline[key] = draft[key];
        syncNeeded = true;
        throw new Error("设置已保存，但需要刷新以确认结果。");
      }
      baseline = {...updated.values}; draft = {...updated.values};
      for (const [key, value] of Object.entries(allChanges)) if (!(key in changes) && key in updated.values) draft[key] = value;
      return true;
    }
    async function runAction(name) {
      if (busy || !state) return;
      setNotice(""); setBusy(true);
      try {
        if (name.startsWith("request_delete__")) {
          const target = name.slice("request_delete__".length);
          const result = await callTool(name);
          const preview = parseDeletePreview({structuredContent:result});
          if (!preview || preview.environment !== target) throw new Error("无法确认要删除的环境，请刷新后重试。");
          openDeleteDialog(preview); return;
        }
        const boundId = name.startsWith("test_connection__") ? name.slice("test_connection__".length) : null;
        const saved = await saveChanges(key => boundId ? environmentForField(key) === boundId : key.startsWith("new_environment_"), id => id === boundId);
        if (saved) {
          syncNeeded = true;
          try { await readSettings(true, !boundId); syncNeeded = false; }
          catch (_) { throw new Error("设置已保存，但刷新失败；请刷新后再测试。"); }
        }
        const result = await callTool(name);
        if (boundId) {
          if (result.action !== "connection_result" || result.environment !== boundId) throw new Error("连接测试结果与所选环境不一致。");
          dispatchUiAction(result); return;
        }
        if (name === "create_environment" && typeof result.environment === "string") {
          selectedEnvironment = result.environment; addingEnvironment = false;
        }
        await readSettings(true, name === "create_environment");
        // Re-render replaces the previous group node. A shared notice keeps
        // action results visible even when the action changes the schema.
        setNotice(formatResult(result, name));
      } catch (error) { setNotice(describeError(error), true); }
      finally { setBusy(false); }
    }
    form.addEventListener("submit", async event => {
      event.preventDefault(); if (busy || !state) return; setNotice(""); setBusy(true);
      let saved = false;
      try { saved = await saveChanges(); if (saved) syncNeeded = true; await readSettings(); syncNeeded = false; }
      catch (error) { setNotice(saved ? "设置已保存，但刷新失败；请刷新设置。" : describeError(error), true); }
      finally { setBusy(false); }
    });
    discardButton.addEventListener("click", () => { if (!busy && state) { draft = {...baseline}; secretDraft = Object.create(null); render(); setNotice(""); } });
    reloadButton.addEventListener("click", async () => {
      if (busy) return;
      if (!syncNeeded && (Object.keys(diff()).length || secretCount())) { setNotice("请先保存或放弃未保存的修改，再重新读取。", true); return; }
      setNotice(""); setBusy(true);
      try {
        const wasRequired = syncNeeded;
        const conflicts = await readSettings(wasRequired, false, wasRequired); syncNeeded = false; flushUiAction();
        if (conflicts.length) setNotice(`配置已变化，${conflicts.join("、")} 的未保存修改及凭证已清除，请检查后重新输入。`, true);
        else if (wasRequired) setNotice("设置已刷新，请检查后继续。");
      }
      catch (error) { setNotice(describeError(error), true); }
      finally { setBusy(false); }
    });
    deleteConfirmation.addEventListener("input", () => {
      deleteError.textContent = "";
      deleteSubmit.disabled = deleteInFlight || !deletePreview || deleteConfirmation.value !== deletePreview.environment;
    });
    deleteCancel.addEventListener("click", () => { if (!deleteInFlight) deleteDialog.close(); });
    deleteDialog.addEventListener("cancel", event => { if (deleteInFlight) event.preventDefault(); });
    deleteDialog.addEventListener("close", () => { deletePreview = null; deleteConfirmation.value = ""; deleteError.textContent = ""; flushUiAction(); });
    connectionClose.addEventListener("click", () => connectionDialog.close());
    connectionDialog.addEventListener("close", flushUiAction);
    deleteSubmit.addEventListener("click", async () => {
      if (deleteInFlight || !deletePreview || deleteConfirmation.value !== deletePreview.environment) return;
      const target = deletePreview.environment;
      deleteInFlight = true; deleteCancel.disabled = true; deleteSubmit.disabled = true; setBusy(true);
      try {
        const result = await callTool("delete_environment", {environment:target, confirmation:deleteConfirmation.value});
        if (!result || result.deleted !== true || result.environment !== target) throw new Error("删除结果无法确认，请刷新后检查。");
        deleteDialog.close();
        delete secretDraft[target];
        if (selectedEnvironment === target) selectedEnvironment = null;
        syncNeeded = true;
        try {
          await readSettings(true, result.default_cleared === true); syncNeeded = false;
          setNotice(`已删除环境 ${target}。`);
        } catch (_) {
          setNotice(`环境 ${target} 已删除，但刷新失败；请刷新设置。`, true);
        }
      } catch (error) { deleteError.textContent = describeError(error); }
      finally { deleteInFlight = false; deleteCancel.disabled = false; deleteSubmit.disabled = !deletePreview || deleteConfirmation.value !== deletePreview.environment; setBusy(false); }
    });
    async function start() {
      if (host === window) { groupsNode.textContent = "请在支持 MCP Apps 的宿主中打开此配置页。"; footerStatus.textContent = "等待宿主"; return; }
      try {
        const result = await request("ui/initialize", {appInfo:{name:"DerbySoft Logs Settings",version:"0.9.0"},appCapabilities:{},protocolVersion:"2026-01-26"});
        initialized = true; setTheme(result.hostContext); notify("ui/notifications/initialized");
        await readSettings(); flushUiAction();
      } catch (error) { groupsNode.textContent = "无法加载配置。"; footerStatus.textContent = "连接失败"; setNotice(describeError(error), true); }
    }
    if (typeof ResizeObserver !== "undefined") {
      let pendingResize = false;
      new ResizeObserver(() => {
        if (!initialized || pendingResize) return;
        pendingResize = true; requestAnimationFrame(() => { pendingResize = false; notify("ui/notifications/size-changed", {height:document.documentElement.scrollHeight, width:document.documentElement.scrollWidth}); });
      }).observe(document.documentElement);
    }
    start();
  })();
  </script>
