name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/derbysoft-logs
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run --frozen python -I -m pytest -q
      - run: uv run --frozen python -I -m ruff check src tests
      - run: uv run --frozen python -I scripts/build_share.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.60.0
      - run: npx playwright install --with-deps chromium
      - run: node plugins/derbysoft-logs/tests/test_analysis_ui.mjs
      - run: node plugins/derbysoft-logs/tests/test_settings_ui.mjs
